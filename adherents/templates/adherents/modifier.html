<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un adhérent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
    {% extends 'adherents/base.html' %}

{% block title %}Liste des adhérents{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Modifier {{ adherent.prenom }} {{ adherent.nom }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{% url 'liste_adherents' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
</body>
</html>
