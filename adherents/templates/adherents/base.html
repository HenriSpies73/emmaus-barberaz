<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Emmaüs Barberaz{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand" href="{% url 'liste_adherents' %}">Emmaüs Barberaz</a>
    {% if user.is_authenticated %}
        <div class="ml-auto">
            <span class="text-light mr-3">{{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Se déconnecter</a>
        </div>
    {% endif %}
</nav>
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
</body>
</html>
